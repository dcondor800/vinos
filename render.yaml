# Blueprint de Render. Al conectar el repo, Render lee esto y crea el servicio.
#
# Las cuatro variables van marcadas con sync: false: Render las pide en el
# dashboard en vez de leerlas de aquí. Nunca pongas los valores en este archivo:
# viaja al repo.
#
# Las NEXT_PUBLIC_* tienen que existir también durante el build, no solo en
# runtime: Next las incrusta en el bundle del navegador y next.config.ts las lee
# para armar remotePatterns de imágenes. En Render las variables del servicio
# están disponibles en ambas fases, así que basta con cargarlas una vez.

services:
  - type: web
    name: vinos
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    # Cada push a main despliega. Sin esto hay que lanzarlo a mano y la app
    # publicada se queda atrás sin que nadie lo note.
    autoDeploy: true
    # No apunta a "/": esa ruta consulta Supabase, así que un problema de
    # configuración o una caída de la base tumbaban el servicio entero con un
    # 502, en vez de degradar solo esa pantalla.
    healthCheckPath: /api/salud
    envVars:
      - key: NODE_VERSION
        value: 22.11.0
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: ADMIN_IMPORT_KEY
        sync: false
